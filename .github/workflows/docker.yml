name: Docker fallback image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gridwise:smoke

      - name: Smoke test /health with no credentials present
        run: |
          docker run -d --name gridwise -p 8000:8000 gridwise:smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"ok"'; then
              echo "health ready after ${attempt}s"
              docker rm -f gridwise
              exit 0
            fi
            sleep 1
          done
          echo "health endpoint never became ready"
          docker logs gridwise
          docker rm -f gridwise
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Report the pullable digest
        run: echo "digest ${{ steps.push.outputs.digest }}"
